    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        if (typeof message === 'string' && message.indexOf('Script error') > -1) {
          return true; // suppress
        }
        return false;
      };
      window.addEventListener('error', function(e) {
        if (e.message === 'Script error.' || e.message === 'Script error' || (e.error && e.error.message && e.error.message.indexOf('Script error') > -1)) {
          e.preventDefault();
          e.stopPropagation();
        }
      });
      const originalConsoleError = console.error;
      console.error = function(...args) {
        if (args.length > 0 && typeof args[0] === 'string' && args[0].includes('Script error')) {
          return;
        }
        originalConsoleError.apply(console, args);
      };
    </script>

      function loadThirdPartyScripts() {

        document.head.appendChild(adScript);
      }

      // Load on user interaction or delayed after load
      ['scroll', 'mousemove', 'touchstart', 'keydown'].forEach(evt => 
        window.addEventListener(evt, loadThirdPartyScripts, { once: true, passive: true })
      );
      
      window.addEventListener('load', () => {
        setTimeout(loadThirdPartyScripts, 7000); // 7s fallback after load
      });
